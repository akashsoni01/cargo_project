services:
  cassandra:
    image: "cassandra:latest"
    container_name: cassandra
    ports:
      - "9042:9042"  # CQL native protocol port
    environment:
      - CASSANDRA_CLUSTER_NAME=Test Cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q UN"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cassandra_network

  redis:
    image: redis:latest
    container_name: redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_URL=redis://redis_container:6379/
    networks:
      - cassandra_network

volumes:
  redis_data:
  cassandra_data:

networks:
  cassandra_network:
    driver: bridge